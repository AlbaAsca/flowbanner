<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#7AA2F7"/><stop offset="1" stop-color="#BB9AF7"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1F2335" stroke-width="1"/>
    </pattern>
    <style>
      .node { fill: #24283B; stroke-width: 2; }
      .label { fill: #C0CAF5; font-size: 17px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #9AA5CE; font-size: 13px; text-anchor: middle; }
      .edge { fill: #9AA5CE; font-size: 12px; text-anchor: middle; }
      .flow { fill: none; stroke-width: 2.5; stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
      .dotted { stroke-dasharray: 2 7; opacity: .75; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .ping { animation: ping 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes ping { 0% { opacity: .9; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.35); } }
    </style>
  </defs>
  <rect width="1200" height="400" rx="18" fill="#16161E"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid)" opacity="0.6"/>
  <text x="60" y="92" font-size="54" font-weight="800" fill="url(#title)">flowbanner</text>
  <text x="62" y="132" font-size="22" fill="#C0CAF5">Escribes un flowchart de Mermaid y obtienes un banner animado para tu README.</text>
  <text x="62" y="162" font-size="16" fill="#9AA5CE">Python sin dependencias · SVG autónomo · temas JSON · GitHub Action</text>
  <path class="flow" stroke="#7DCFFF" d="M200 290 H285.8"/>
  <path class="flow" stroke="#7AA2F7" d="M452.8 290 H538.5"/>
  <path class="flow" stroke="#E0AF68" d="M688.5 290 H774.2"/>
  <path class="flow" stroke="#BB9AF7" d="M924.2 290 H1010"/>
  <circle class="packet" r="6" fill="#7DCFFF"><animateMotion dur="4s" begin="0s" repeatCount="indefinite" path="M125 290 H200 H285.8 H452.8 H538.5 H688.5 H774.2 H924.2 H1010 H1085"/></circle>
  <circle class="packet" r="5" fill="#7AA2F7"><animateMotion dur="4s" begin="-1.3s" repeatCount="indefinite" path="M125 290 H200 H285.8 H452.8 H538.5 H688.5 H774.2 H924.2 H1010 H1085"/></circle>
  <circle class="packet" r="5" fill="#E0AF68"><animateMotion dur="4s" begin="-2.7s" repeatCount="indefinite" path="M125 290 H200 H285.8 H452.8 H538.5 H688.5 H774.2 H924.2 H1010 H1085"/></circle>
  <rect class="node" x="50" y="245" width="150" height="90" rx="14" stroke="#7DCFFF"/>
  <text class="label" x="125" y="284">hero.mmd</text>
  <text class="sub" x="125" y="308">texto en tu repo</text>
  <rect class="node" x="285.8" y="245" width="167" height="90" rx="14" stroke="#7AA2F7"/>
  <text class="label" x="369.2" y="284">Parser</text>
  <text class="sub" x="369.2" y="308">subconjunto de Mermaid</text>
  <rect class="node" x="538.5" y="245" width="150" height="90" rx="14" stroke="#E0AF68"/>
  <text class="label" x="613.5" y="284">Layout</text>
  <text class="sub" x="613.5" y="308">columnas y filas</text>
  <rect class="node" x="774.2" y="245" width="150" height="90" rx="14" stroke="#BB9AF7"/>
  <text class="label" x="849.2" y="284">Tema</text>
  <text class="sub" x="849.2" y="308">Tokyo Night</text>
  <rect class="node" x="1010" y="245" width="150" height="90" rx="14" stroke="#9ECE6A"/>
  <text class="label" x="1085" y="284">hero.svg</text>
  <text class="sub" x="1085" y="308">listo para img</text>
</svg>
