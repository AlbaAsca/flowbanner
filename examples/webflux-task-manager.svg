<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#7AA2F7"/><stop offset="1" stop-color="#BB9AF7"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1F2335" stroke-width="1"/>
    </pattern>
    <style>
      .node { fill: #24283B; stroke-width: 2; }
      .label { fill: #C0CAF5; font-size: 17px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #9AA5CE; font-size: 13px; text-anchor: middle; }
      .edge { fill: #9AA5CE; font-size: 12px; text-anchor: middle; }
      .flow { fill: none; stroke-width: 2.5; stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
      .dotted { stroke-dasharray: 2 7; opacity: .75; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .ping { animation: ping 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes ping { 0% { opacity: .9; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.35); } }
    </style>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#16161E"/>
  <rect width="1200" height="560" rx="18" fill="url(#grid)" opacity="0.6"/>
  <text x="60" y="92" font-size="54" font-weight="800" fill="url(#title)">WebFlux Task Manager</text>
  <text x="62" y="132" font-size="22" fill="#C0CAF5">API reactiva de tareas: lo que cambia un usuario lo ven todos, al instante.</text>
  <text x="62" y="162" font-size="16" fill="#9AA5CE">Java 21 · Spring Boot 4 · WebFlux · MongoDB reactivo · HATEOAS · SSE · Testcontainers</text>
  <path class="flow" stroke="#9ECE6A" d="M286.4 350 H526.4"/>
  <path class="flow" stroke="#7DCFFF" d="M683.6 350 C803.6 350, 803.6 290, 923.6 290"/>
  <path class="flow" stroke="#7DCFFF" d="M683.6 350 C803.6 350, 803.6 410, 923.6 410"/>
  <path class="flow dotted" stroke="#7DCFFF" d="M605 395 C605 465, 211.4 465, 211.4 395"/>
  <circle class="packet" r="6" fill="#9ECE6A"><animateMotion dur="2s" begin="0s" repeatCount="indefinite" path="M211.4 350 H286.4 H526.4 H683.6 C803.6 350, 803.6 290, 923.6 290 H998.6"/></circle>
  <circle class="packet" r="6" fill="#7DCFFF"><animateMotion dur="2s" begin="0s" repeatCount="indefinite" path="M605 350 H683.6 C803.6 350, 803.6 410, 923.6 410 H998.6"/></circle>
  <circle class="packet" r="6" fill="#7DCFFF"><animateMotion dur="2s" begin="0s" repeatCount="indefinite" path="M605 395 C605 465, 211.4 465, 211.4 395"/></circle>
  <rect class="node" x="136.4" y="305" width="150" height="90" rx="14" stroke="#9ECE6A"/>
  <text class="label" x="211.4" y="344">Usuaria A</text>
  <text class="sub" x="211.4" y="368">POST /api/tasks</text>
  <rect class="node ping" x="526.4" y="305" width="157.3" height="90" rx="14" stroke="#7DCFFF"/>
  <rect class="node" x="526.4" y="305" width="157.3" height="90" rx="14" stroke="#7DCFFF"/>
  <text class="label" x="605" y="344">Spring WebFlux</text>
  <text class="sub" x="605" y="368">HATEOAS · Sinks</text>
  <rect class="node" x="923.6" y="245" width="150" height="90" rx="14" stroke="#9ECE6A"/>
  <text class="label" x="998.6" y="284">MongoDB</text>
  <text class="sub" x="998.6" y="308">reactivo</text>
  <rect class="node" x="923.6" y="365" width="150" height="90" rx="14" stroke="#BB9AF7"/>
  <text class="label" x="998.6" y="416">Usuario B</text>
  <text class="edge" x="803.6" y="370">SSE</text>
  <text class="edge" x="408.2" y="463.5">SSE</text>
</svg>
